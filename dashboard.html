<!DOCTYPE html>
<html>
<head>
    <title>ZENO Premium Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-10">

<h1 class="text-3xl font-bold mb-6 text-mint-400">💎 ZENO Premium Dashboard</h1>

<table class="w-full bg-gray-800 rounded-xl overflow-hidden">
    <thead class="bg-gray-700">
        <tr>
            <th class="p-3">User ID</th>
            <th class="p-3">Role ID</th>
            <th class="p-3">Expire</th>
            <th class="p-3">Action</th>
        </tr>
    </thead>
    <tbody>
        {% for m in members %}
        <tr class="border-b border-gray-700">
            <td class="p-3">{{ m.user_id }}</td>
            <td class="p-3">{{ m.role_id }}</td>
            <td class="p-3">{{ format_time(m.expire) }}</td>
            <td class="p-3">
                <a href="/delete/{{ m.user_id }}"
                   class="bg-red-500 px-4 py-2 rounded-xl">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
